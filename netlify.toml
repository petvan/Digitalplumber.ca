# Netlify serves this repo as a static site, straight from the repo root.
# There is deliberately no build step on Netlify: the pages are generated by the
# "Daily News Build" GitHub Action (build.js) and committed to main, and every
# push to main triggers a Netlify deploy.
[build]
  publish = "."
  command = "echo 'No build step: pages are built by GitHub Actions and committed to the repo'"
