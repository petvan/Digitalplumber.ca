name: Daily News Build

on:
  # Run every day at 8 AM Eastern Time (1 PM UTC)
  schedule:
    - cron: '0 13 * * *'

  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push index.html back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run news build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node build.js

      - name: Commit and push updated index.html
        run: |
          git config user.name  "Daily News Bot"
          git config user.email "bot@digitalplumber.ca"
          git add index.html
          # Only commit if index.html actually changed
          git diff --staged --quiet || git commit -m "Daily news update $(date +'%Y-%m-%d')"
          git push
