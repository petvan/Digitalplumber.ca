name: Daily News Build

on:
  # Run every day at 6 AM Eastern Time (10 AM UTC)
  schedule:
    - cron: '0 10 * * *'

  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push index.html back to the repo
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run news build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node build.js

      - name: Commit and push updated index.html
        run: |
          git config user.name  "Daily News Bot"
          git config user.email "bot@digitalplumber.ca"
          git add index.html archives/ sitemap.xml
          # Only commit if anything changed
          git diff --staged --quiet || git commit -m "Daily news update $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
